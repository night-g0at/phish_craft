[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "phishing-trainer"
version = "0.1.0"
description = "Phishing email generator for cybersecurity awareness training"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-anthropic>=0.3",
    "httpx>=0.27",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "typer>=0.12",
]

[project.scripts]
phishing = "phishing.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["phishing*"]
